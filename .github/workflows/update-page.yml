name: Update proxy page

on:
  workflow_dispatch:
  push:
    paths:
      - "update_page.py"
      - "test_ui.py"
      - ".github/workflows/update-page.yml"
  schedule:
    # Новый пул каждые 2 часа.
    - cron: "19 */2 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build page
        run: python3 update_page.py

      - name: Test UI
        run: python3 test_ui.py

      - name: Commit fresh page
        run: |
          if git status --porcelain index.html proxy_catalog.json | grep -q .; then
            git config user.name "mtproto-proxy-page"
            git config user.email "actions@users.noreply.github.com"
            git add index.html proxy_catalog.json
            git commit -m "Update fresh proxies"
            git push
          else
            echo "No page changes"
          fi
