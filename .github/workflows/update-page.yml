name: Update proxy page

on:
  workflow_dispatch:
  schedule:
    # GitHub cron использует UTC. 03:19 UTC = 06:19 при UTC+3.
    - cron: "19 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build page
        run: python3 update_page.py

      - name: Commit fresh page
        run: |
          if git status --porcelain index.html | grep -q .; then
            git config user.name "mtproto-proxy-page"
            git config user.email "actions@users.noreply.github.com"
            git add index.html
            git commit -m "Update fresh proxies"
            git push
          else
            echo "No page changes"
          fi
